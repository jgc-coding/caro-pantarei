# Baut die Website bei jedem Push auf main und veroeffentlicht sie auf GitHub Pages.
# Muster uebernommen aus dem Achievewear-Blog.
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Einzige Quelle fuer URL und Base-Pfad (siehe CLAUDE.md).
  # Bei eigener Domain spaeter: SITE_URL=https://<domain> und BASE_PATH=/
  SITE_URL: https://jgc-coding.github.io
  BASE_PATH: /caro-pantarei

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Hinweis fuer ein kuenftiges neues Repo: GitHub Pages muss EINMALIG von aussen
      # eingeschaltet werden, dieser Workflow kann das nicht selbst.
      #   gh api repos/<owner>/<repo>/pages -X POST -f build_type=workflow
      # Der Schluessel eines Workflows darf eine Pages-Seite veroeffentlichen, aber nicht
      # anlegen ("Resource not accessible by integration"). actions/configure-pages mit
      # enablement:true scheitert aus demselben Grund und wurde deshalb wieder entfernt.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Rote Typen sollen den Deploy stoppen, BEVOR eine kaputte Seite live geht.
      - run: npm run check
      - run: npm run build
      # Prueft die gebaute Ausgabe auf interne Verweise ohne Unterordner-Pfad und auf
      # Links ins Leere. `astro check` kann das nicht sehen — es prueft Typen, nicht das
      # Ergebnis. Genau diese Luecke hatte am 2026-07-25 einen kaputten Sitemap-Verweis
      # durchgelassen.
      - run: npm run pruefe:links
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
